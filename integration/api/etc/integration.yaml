# 仓库根目录：go run ./api
# 本目录：go run . -f etc/integration.yaml
Name: integration-api
Host: 0.0.0.0
Port: 18005
Timeout: 30000 # 毫秒，需覆盖 RPC 查 IP 的耗时
Mode: dev # 本地开放 /swagger；线上用 pro（或不写，默认 pro）

# 多语言
I18n:
  DefaultLanguage: zh-CN

Log:
  Mode: file
  Path: logs
  Stat: false

CROSConf:
  Address: '*'

# 本地直连 rpc ListenOn（与 core / oss 一致）。生产可改成 Etcd。
IntegrationRpc:
  Endpoints:
    - 127.0.0.1:19005
  NonBlock: true
  Timeout: 30000

# JWT：core CheckToken。必填，HTTP 全部要登录。
CoreRpc:
  Endpoints:
    - 192.168.0.15:19000
  NonBlock: true
  Timeout: 10000
