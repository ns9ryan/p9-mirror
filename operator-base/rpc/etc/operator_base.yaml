# RPC服务配置
Name:     operator-base-rpc       # RPC服务名称
ListenOn: 0.0.0.0:39001           # RPC监听地址
Mode:     dev                     # 运行模式
DefaultSiteLogoURL: http://192.168.10.220:9200/oss-bucket/defaults/site-logo-761a9ddc0f04862c.png

# Logo 公开访问前缀，包含桶名；保存时提取 Key，查询时拼回完整 URL。
SiteLogoBaseURL: "http://192.168.10.220:9200/oss-bucket"

# Etcd服务注册配置
Etcd:
  Hosts:
    - 127.0.0.1:12379             # Etcd地址
  Key: operator-base-rpc          # 服务注册Key

# 数据库配置
DatabaseConf:
  Host:     127.0.0.1             # 当前节点数据库地址
  Port:     15432                 # node-01 PostgreSQL宿主机端口
  DBName:   p9_operator01           # 厅数据库名称
  Username: root                  # 数据库用户名
  Password: root                  # 数据库密码
  SSLMode:  disable               # SSL模式

# 站点配置详情查询依赖，按部署环境填写后启用；未配置时保留原有业务能力。
OperatorCoreRpc:
  Endpoints:
    - 127.0.0.1:19100
  Timeout: 3000
PlatformBaseRpc:
  Endpoints:
    - 127.0.0.1:19001
  Timeout: 3000
