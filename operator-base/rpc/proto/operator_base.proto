syntax = "proto3";

package operator_base;

option go_package = "oa.98ent.com/p9/operator-base/rpc/pb/operatorbaserpc";

import "types/operator_base_ping.proto";
import "types/operator_base_operator.proto";

// Ping 服务
service PingService {
  // Ping
  rpc Ping(operator_base_ping.PingRequest) returns (operator_base_ping.PingResponse);
}

// 厅 operator 服务
service OperatorService {
  // 初始化厅 operator
  rpc Initialize(operator_base_operator.InitializeOperatorRequest) returns (operator_base_operator.InitializeOperatorResponse);

  // 初始化基础资源分配到指定分站
  rpc InitializeBasicResources(operator_base_operator.InitializeBasicResourcesRequest) returns (operator_base_operator.InitializeBasicResourcesResponse);

  // 初始化域名到指定分站
  rpc InitializeDomains(operator_base_operator.InitializeDomainsRequest) returns (operator_base_operator.InitializeDomainsResponse);

  // 删除分站基础资源数据
  rpc DeleteOperatorBasicResources(operator_base_operator.DeleteOperatorBasicResourcesRequest) returns (operator_base_operator.DeleteOperatorBasicResourcesResponse);

  // 删除分站域名
  rpc DeleteOperatorDomains(operator_base_operator.DeleteOperatorDomainsRequest) returns (operator_base_operator.DeleteOperatorDomainsResponse);
}