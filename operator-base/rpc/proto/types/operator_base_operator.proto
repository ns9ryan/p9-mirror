syntax = "proto3";

package operator_base_operator;

option go_package = "oa.98ent.com/p9/operator-base/rpc/pb/operatorbaserpc/operatorpb";

// operator 初始化基础信息
message OperatorInitializationInfo {
  // operator 全局唯一业务编码
  string code = 1;
  // operator 名称
  string name = 2;
  // IANA 时区编码
  string timezone_code = 3;
  // 结算货币编码
  string settlement_currency_code = 4;
  // operator 状态: 1正常, 2暂停, 3关闭
  int64 status = 5;
}

// operator 初始化域名信息
message OperatorDomainInitializationInfo {
  // 域名, 不包含协议和端口
  string domain_name = 1;
  // 域名类型: 1分站后台, 2代理后台, 3会员H5
  int64 domain_type = 2;
}

// 初始化 operator 请求
message InitializeOperatorRequest {
  // operator 基础信息
  OperatorInitializationInfo operator = 1;
  // 当前有效域名
  repeated OperatorDomainInitializationInfo domains = 2;
  // 当前有效语言编码
  repeated string language_codes = 3;
  // 当前有效经营地区编码
  repeated string region_codes = 4;
  // 当前有效代理子线路编码
  repeated string agent_line_codes = 5;
}

// 初始化 operator 响应
message InitializeOperatorResponse {}

// 资源初始化统计信息
message ResourceStat {
  // 总数
  int64 total = 1;
  // 成功初始化数量
  int64 success = 2;
  // 失败初始化数量
  int64 failed = 3;
}

// 初始化基础资源分配请求
message InitializeBasicResourcesRequest {
  // 分站全局唯一业务编码
  string operator_code = 1;
  // 当前分配的语言编码
  repeated string language_codes = 2;
  // 当前分配的国家地区编码
  repeated string region_codes = 3;
  // 当前分配的代理子线路编码
  repeated string agent_line_codes = 4;
}

// 初始化基础资源分配响应
message InitializeBasicResourcesResponse {
  // 初始化是否成功
  bool success = 1;
  // 错误或结果信息
  string message = 2;
  // 语言初始化统计
  ResourceStat language_stat = 3;
  // 地区初始化统计
  ResourceStat region_stat = 4;
  // 代理线路初始化统计
  ResourceStat agent_line_stat = 5;
}

// 域名模型
message DomainModel {
  // 域名, 不包含协议和端口
  string domain_name = 1;
  // 域名类型: 1分站后台, 2代理后台, 3会员H5
  int64 domain_type = 2;
}

// 初始化域名请求
message InitializeDomainsRequest {
  // 分站全局唯一业务编码
  string operator_code = 1;
  // 分站域名列表
  repeated DomainModel domain_list = 2;
}

// 初始化域名响应
message InitializeDomainsResponse {
  // 初始化是否成功
  bool success = 1;
  // 错误或结果信息
  string message = 2;
  // 域名初始化统计
  ResourceStat domain_stat = 3;
}

// 删除分站数据请求
message DeleteOperatorBasicResourcesRequest {
  // 分站全局唯一业务编码
  string operator_code = 1;
}

// 删除分站数据响应
message DeleteOperatorBasicResourcesResponse {
  // 删除是否成功
  bool success = 1;
  // 错误或结果信息
  string message = 2;
  // 删除的域名数量
  int64 domain_deleted = 3;
  // 删除的语言数量
  int64 language_deleted = 4;
  // 删除的地区数量
  int64 region_deleted = 5;
  // 删除的代理线路数量
  int64 agent_line_deleted = 6;
}

// 删除分站域名请求
message DeleteOperatorDomainsRequest {
  // 分站全局唯一业务编码
  string operator_code = 1;
  // 要删除的域名列表
  repeated string domain_names = 2;
}

// 删除分站域名响应
message DeleteOperatorDomainsResponse {
  // 删除是否成功
  bool success = 1;
  // 错误或结果信息
  string message = 2;
  // 删除的域名数量
  int64 domain_deleted = 3;
}

// 获取分站已分配代理子线路请求
message GetAgentLinesRequest {
  // 分站全局唯一业务编码
  string operator_code = 1;
}

// 获取分站已分配代理子线路响应
message GetAgentLinesResponse {
  // 当前有效代理子线路编码
  repeated string agent_line_codes = 1;
}