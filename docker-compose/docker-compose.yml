services:
  nginx:
    image: 192.168.10.220:5000/p9/nginx-manager:1.0.0
    container_name: p9-nginx
    restart: always

    ports:
      - "80:80"
      # 后续 HTTPS 再开放
      # - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /home/alan/headquarter:/var/www/headquarter:ro
      - /home/alan/outstation:/var/www/outstation:ro

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - p9-shared-network 
  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ns92126
      MYSQL_DATABASE: demo
      MYSQL_USER: app
      MYSQL_PASSWORD: app123
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app123
      POSTGRES_DB: p9_platform
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d demo"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: etcd
    restart: unless-stopped
    environment:
      ETCD_NAME: etcd0
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://192.168.10.220:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://127.0.0.1:2380
      ETCD_INITIAL_CLUSTER: etcd0=http://127.0.0.1:2380
      ETCD_INITIAL_CLUSTER_TOKEN: etcd-cluster
      ETCD_INITIAL_CLUSTER_STATE: new
    ports:
      - "2379:2379"
    volumes:
      - etcd_data:/etcd-data
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://192.168.10.220:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"   # HTTP
      - "9000:9000"   # Native
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  jaeger:
    image: jaegertracing/all-in-one:1.74.0
    container_name: p9-jaeger
    restart: always
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      TZ: Asia/Shanghai
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  doris-fe:
    image: "ghcr.io/0xskywell/doris-docker-images-fe:4.1.4-jdk17.0.10"
    container_name: "doris-fe"
    hostname: "fe"
    environment:
      - FE_SERVERS=fe1:10.88.0.2:9010
      - FE_ID=1
      - PRIORITY_NETWORKS=127.0.0.0/8
    ports:
      - 8031:8030     # HTTP
      - 9031:9030     # MySQL 协议
    volumes:
      - ./doris/fe/doris-meta:/opt/apache-doris/fe/doris-meta
      - ./doris/fe/log:/opt/apache-doris/fe/log
      - ./doris/fe/conf/fe.conf:/opt/apache-doris/fe/conf/fe.conf
    networks:
      doris_net:
        ipv4_address: 10.88.0.2
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "nc -z 10.88.0.2 9010 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
  doris-be:
    image: "ghcr.io/0xskywell/doris-docker-images-be:4.1.4-jdk17.0.10"
    container_name: "doris-be"
    hostname: "be"
    depends_on:
      - doris-fe
    environment:
      - BE_ADDR=10.88.0.5:9050
      - FE_SERVERS=fe1:10.88.0.2:9010
      - PRIORITY_NETWORKS=10.88.0.0/24
    ports:
      - 8041:8040     # BE HTTP
    volumes:
      - doris-be-storage:/opt/apache-doris/be/storage
      - ./doris/be/script:/docker-entrypoint-initdb.d
      - ./doris/be/log:/opt/apache-doris/be/log
    networks:
      doris_net:
        ipv4_address: 10.88.0.5
    restart: on-failure

  debezium-connect:
    image: debezium/connect:2.7.3.Final
    container_name: debezium-connect
    environment:
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      BOOTSTRAP_SERVERS: 192.168.10.220:9094
      CONNECT_CONFIGURATION_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
    ports:
      - "8083:8083"
    networks:
      - p9-shared-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8083/" ]
      interval: 10s
      timeout: 10s
      retries: 5

  # Kafka UI (Optional - for monitoring)
  # Connects to external Kafka instance
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: debezium-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: debezium
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: 192.168.10.220:9094
      KAFKA_CLUSTERS_0_ZOOKEEPER: host.docker.internal:2181
    ports:
      - "8089:8080"
    networks:
      - p9-shared-network
volumes:
  mysql_data:
  postgres_data:
  redis_data:
  etcd_data:
  kafka_data:
  clickhouse_data:
  doris-be-storage:

networks:
  p9-shared-network:
    external: true
  doris_net:
    name: doris-net
    driver: bridge
    ipam:
      config:
        - subnet: 10.88.0.0/24
          gateway: 10.88.0.1
