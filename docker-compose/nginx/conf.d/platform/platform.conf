server {
    listen 80;
    server_name platform.test;

    root /var/www/headquarter;
    index index.html;

    # =========================
    # Core API
    # /admin/core/*
    #     ↓
    # /core/*
    #     ↓
    # 18000
    # =========================
    location /admin/core/ {
        rewrite ^/admin/core/(.*)$ /core/$1 break;

        proxy_pass http://host.docker.internal:18000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================
    # Base API
    # /admin/base/*
    #     ↓
    # /admin/*
    #     ↓
    # 18001
    # =========================
    location /admin/base/ {
        rewrite ^/admin/base/(.*)$ /admin/$1 break;

        proxy_pass http://host.docker.internal:18001;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================
    # Game API
    # /admin/game/*
    #     ↓
    # /platform-game/*
    #     ↓
    # 18003
    # =========================
    location /admin/game/ {
        rewrite ^/admin/game/(.*)$ /platform-game/$1 break;

        proxy_pass http://host.docker.internal:18003;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================
    # Operator API
    # /admin/operator/*
    #     ↓
    # /admin/operator/*
    #     ↓
    # 18002
    # =========================
    location /admin/operator/ {
        proxy_pass http://host.docker.internal:18002;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================
    # Dispatch API
    # /admin/dispatch/*
    #     ↓
    # /admin/dispatch/*
    #     ↓
    # 28001
    # =========================
    location /admin/dispatch/ {
        proxy_pass http://host.docker.internal:28001/admin/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================
    # 前端 SPA
    # =========================
    location / {
        try_files $uri $uri/ /index.html;
    }
}
