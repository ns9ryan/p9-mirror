# Nginx config for op.test.com
server {
    listen 80;
    server_name op.test.com;

    root /var/www/outstation;
    index index.html;

    # =========================
    # Core API
    # /admin/core/* → /core/*
    # =========================
    location /admin/core/ {
        rewrite ^/admin/core/(.*)$ /core/$1 break;

        proxy_pass http://host.docker.internal:38000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================
    # Base API
    # /admin/base/* → /admin/*
    # =========================
    location /admin/base/ {
        rewrite ^/admin/base/(.*)$ /admin/$1 break;

        proxy_pass http://host.docker.internal:38001;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================
    # Game API
    # /admin/game/* → /operator-game/*
    # =========================
    location /admin/game/ {
        rewrite ^/admin/game/(.*)$ /operator-game/$1 break;

        proxy_pass http://host.docker.internal:38003;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================
    # Operator API
    # =========================
    location /admin/operator/ {
        proxy_pass http://host.docker.internal:18002;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================
    # Dispatch API
    # =========================
    location /admin/dispatch/ {
        proxy_pass http://host.docker.internal:28001;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================
    # 前端 SPA
    # =========================
    location / {
        try_files $uri $uri/ /index.html;
    }
}
