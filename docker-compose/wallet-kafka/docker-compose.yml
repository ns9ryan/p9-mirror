services:
  wallet-kafka-1:
    image: apache/kafka:4.3.2
    hostname: wallet-kafka-1
    container_name: wallet-kafka-1
    restart: unless-stopped
    cpus: 2
    mem_limit: 2g
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://wallet-kafka-1:9092,EXTERNAL://192.168.10.220:9194
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@wallet-kafka-1:9093,2@wallet-kafka-2:9093,3@wallet-kafka-3:9093

      KAFKA_NUM_PARTITIONS: 32
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512M -Xmx1G

      KAFKA_LOG_RETENTION_MS: "-1"
      KAFKA_LOG_RETENTION_BYTES: "-1"

      CLUSTER_ID: wg22feGmQQGe7QJKFQSUzw

    ports:
      - "9194:9094"

    volumes:
      - wallet-kafka-1-data:/var/lib/kafka/data

    networks:
      - p9-shared-network

    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  wallet-kafka-2:
    image: apache/kafka:4.3.2
    hostname: wallet-kafka-2
    container_name: wallet-kafka-2
    restart: unless-stopped
    cpus: 2
    mem_limit: 2g
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://wallet-kafka-2:9092,EXTERNAL://192.168.10.220:9195
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@wallet-kafka-1:9093,2@wallet-kafka-2:9093,3@wallet-kafka-3:9093

      KAFKA_NUM_PARTITIONS: 32
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512M -Xmx1G

      KAFKA_LOG_RETENTION_MS: "-1"
      KAFKA_LOG_RETENTION_BYTES: "-1"

      CLUSTER_ID: wg22feGmQQGe7QJKFQSUzw

    ports:
      - "9195:9094"

    volumes:
      - wallet-kafka-2-data:/var/lib/kafka/data

    networks:
      - p9-shared-network

    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  wallet-kafka-3:
    image: apache/kafka:4.3.2
    hostname: wallet-kafka-3
    container_name: wallet-kafka-3
    restart: unless-stopped
    cpus: 2
    mem_limit: 2g
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://wallet-kafka-3:9092,EXTERNAL://192.168.10.220:9196
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@wallet-kafka-1:9093,2@wallet-kafka-2:9093,3@wallet-kafka-3:9093

      KAFKA_NUM_PARTITIONS: 32
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512M -Xmx1G

      KAFKA_LOG_RETENTION_MS: "-1"
      KAFKA_LOG_RETENTION_BYTES: "-1"

      CLUSTER_ID: wg22feGmQQGe7QJKFQSUzw

    ports:
      - "9196:9094"

    volumes:
      - wallet-kafka-3-data:/var/lib/kafka/data

    networks:
      - p9-shared-network

    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  wallet-kafka-init:
    image: apache/kafka:4.3.2
    container_name: wallet-kafka-init
    restart: "no"
    depends_on:
      wallet-kafka-1:
        condition: service_healthy
      wallet-kafka-2:
        condition: service_healthy
      wallet-kafka-3:
        condition: service_healthy

    command:
      - /opt/kafka/bin/kafka-topics.sh
      - --bootstrap-server
      - wallet-kafka-1:9092
      - --create
      - --if-not-exists
      - --topic
      - p9-wallet-events
      - --partitions
      - "32"
      - --replication-factor
      - "3"
      - --config
      - min.insync.replicas=2

    networks:
      - p9-shared-network

  # 钱包 Kafka 可视化管理界面
  wallet-kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: wallet-kafka-ui
    restart: unless-stopped
    cpus: 1
    mem_limit: 1g

    ports:
      - "18081:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: wallet
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: wallet-kafka-1:9092,wallet-kafka-2:9092,wallet-kafka-3:9092
      # 只读模式
      KAFKA_CLUSTERS_0_READONLY: "true"

    depends_on:
      wallet-kafka-1:
        condition: service_healthy
      wallet-kafka-2:
        condition: service_healthy
      wallet-kafka-3:
        condition: service_healthy

    networks:
      - p9-shared-network

volumes:
  wallet-kafka-1-data:
    name: wallet-kafka-1-data

  wallet-kafka-2-data:
    name: wallet-kafka-2-data

  wallet-kafka-3-data:
    name: wallet-kafka-3-data

networks:
  p9-shared-network:
    external: true
  