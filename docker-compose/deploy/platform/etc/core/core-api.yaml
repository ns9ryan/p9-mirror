Name: platform-core-api
Host: 0.0.0.0
Port: 18000
Mode: dev # 开发模式

Log:
  Mode: console
  Level: info

# 链路追踪, 生产建议 Sampler 0.01~0.1
Telemetry:
  Name: platform-core-api
  Endpoint: 192.168.0.15:4317
  Sampler: 1.0
  Batcher: otlpgrpc

# 模式 on分站，off总网
PartnerMode: "off"

CROSConf:
  Address: '*'

CoreRpc:
  Endpoints:
    - platform-core-rpc:19000
  NonBlock: true
  Timeout: 10000

