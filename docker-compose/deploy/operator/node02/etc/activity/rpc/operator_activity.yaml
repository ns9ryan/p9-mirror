# RPC服务配置
Name:     operator02-activity-rpc   # RPC服务名称
ListenOn: 0.0.0.0:39206           # RPC监听地址
Mode:     dev                     # 运行模式

# Etcd服务注册配置
Etcd:
  Hosts:
    - 192.168.10.220:2379           # Etcd地址
  Key: operator02-activity-rpc      # 服务注册Key

# 数据库配置
DatabaseConf:
  Host:     postgres            # 当前节点数据库地址
  Port:     5432                # node-01 PostgreSQL宿主机端口
  DBName:   p9_operator         # 厅数据库名称
  Username: root                # 数据库用户名
  Password: root                # 数据库密码
  SSLMode:  disable             # SSL模式

# 后台CRM RPC配置
CrmRpc:
  Etcd:
    Hosts:
      - 192.168.10.220:2379
    Key: crm02-rpc

KqBrokers:
  - 192.168.10.220:9094

RedisAddr: redis:6379

TemporalInfo:
  Address: "192.168.10.220:7233"
  Namespace: "default"

# 是否启动活动引擎
EnableActivityEngine: true
