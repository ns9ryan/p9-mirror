# RPC服务配置
Name:     crm-rpc         # RPC服务名称
ListenOn: 0.0.0.0:39002   # RPC监听地址
Mode:     dev             # 运行模式

# Etcd服务注册配置
Etcd:
  Hosts:
    - 192.168.10.220:2379     # Etcd地址
  Key: crm01-rpc            # 服务注册Key

# 数据库配置
DatabaseConf:
  Host:     postgres        # 数据库地址
  Port:     5432           # 数据库端口
  DBName:   p9_operator     # 数据库名称
  Username: root            # 数据库用户名
  Password: root            # 数据库密码
  SSLMode:  disable         # SSL模式

# 代理后台 JWT配置
AgentAdminJwt:
  AccessSecret: operator01-agent-jwt-secret
  AccessExpire: 86400
  RefreshSecret: operator01-agent-jwt-refresh-secret
  RefreshExpire: 604800

# 令牌黑名单 Redis 配置
DataRedis:
  Host: redis:6379
  Pass: ""
  DB: 0
FieldCrypto:
  EncryptionKey: "96e68da6d8397306c545e446b6443b84"
  LookupKey: "bf5049b3c98fd408a20d7302ac1c697f66fcb37a7d81bb3889cad07f05b2b5bc"
PlatformBaseRpc:
  Endpoints:
    - 192.168.10.220:19001

Kafka:
  Brokers:
    - 192.168.10.220:9094

# VIP图片公开访问前缀，包含桶路径
ResourceBaseURL: "http://192.168.10.220:9200/oss-bucket"
