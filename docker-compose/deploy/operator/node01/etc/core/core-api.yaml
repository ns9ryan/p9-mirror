Name: operator01-core-api
Host: 0.0.0.0
Port: 38000
Mode: dev

Log:
  Mode: console
  Level: info

# 模式 on分站，off总网
PartnerMode: "on"
  
CROSConf:
  Address: '*'

CoreRpc:
  Endpoints:
    - operator-node01-core-rpc:39000
  NonBlock: true
  Timeout: 10000

# 链路追踪, 生产建议 Sampler 0.01~0.1
Telemetry:
  Name: operator01-core-api
  Endpoint: 192.168.0.15:4317
  Sampler: 1.0
  Batcher: otlpgrpc
