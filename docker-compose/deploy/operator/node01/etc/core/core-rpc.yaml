Name: operator01-core-rpc
ListenOn: 0.0.0.0:39000
Timeout: 10000
Mode: dev # 开发模式

Log:
  Mode: console
  Level: info

DB:
  Driver: postgres
  DSN: "host=postgres user=root password=root dbname=p9_operator port=5432 sslmode=disable TimeZone=UTC"

# Etcd服务注册配置
Etcd:
  Hosts:
    - 192.168.0.15:2379
  Key: operator01-core-rpc

DataRedis:
  Host: redis:6379
  Pass: ""
  DB: 0

Jwt:
  AccessSecret: rbacx-example-secret-node01
  AccessExpire: 86400
  RefreshSecret: rbacx-example-refresh-secret-node01
  RefreshExpire: 604800

# 链路追踪, 生产建议 Sampler 0.01~0.1
Telemetry:
  Name: operator01-core-rpc
  Endpoint: 192.168.0.15:4317
  Sampler: 1.0
  Batcher: otlpgrpc

PartnerMode: "on"
APIPrefix: /admin
InitToken: change-me-init-token

