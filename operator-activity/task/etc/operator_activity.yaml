# RPC服务配置
Name:     operator-activity-rpc   # RPC服务名称
ListenOn: 0.0.0.0:39006           # RPC监听地址
Mode:     pro                     # 运行模式

# Etcd服务注册配置
Etcd:
  Hosts:
    - 127.0.0.1:2379             # Etcd地址
  Key: operator-activity-rpc      # 服务注册Key

# 数据库配置
DatabaseConf:
  Host:     127.0.0.1             # 当前节点数据库地址
  Port:     5432                 # node-01 PostgreSQL宿主机端口
  DBName:   p9_operator         # 厅数据库名称
  Username: root                  # 数据库用户名
  Password: root                  # 数据库密码
  SSLMode:  disable               # SSL模式


KqBrokers:
  - 127.0.0.1:9094

RedisConf:
  Address: 127.0.0.1:6379                          # Redis Server地址
  Password: ""                                     # Redis密码
  DB: 0                                           # Redis数据库编号

# 游戏服务 RPC 配置（用于查询下注会员，生产环境使用 Etcd 服务发现）
OperatorGameRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379                            # Etcd地址
    Key: operator-game-rpc                        # 游戏服务 RPC 服务注册Key
  Timeout: 10000                                  # 请求超时（毫秒）

OperatorBaseRpc:
  Endpoints:
    - 192.168.10.220:39001        # Operator Base RPC地址
  Timeout: 10000            # 请求超时（毫秒）

EnableTaskTimer: false
