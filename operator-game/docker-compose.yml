name: operator-node01

services:
  postgres:
    image: postgres:16-alpine
    container_name: operator-node01-postgres
    restart: always
    ports:
      - "15441:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app123}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      TZ: Asia/Shanghai
    volumes:
      - postgres_operator_node01_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - p9-operator-node01-network

  redis:
    image: redis:7-alpine
    container_name: operator-node01-redis
    restart: always
    ports:
      - "16381:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_operator_node01_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - p9-operator-node01-network

  core-rpc:
    image: ${DOCKER_REPO:-192.168.0.15:5000/p9}/core-rpc:${VERSION:-1.0.0}
    container_name: operator-node01-core-rpc
    restart: always
    ports:
      - "39000:39000"
    volumes:
      - ./etc/core/core-rpc.yaml:/app/etc/core.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - p9-operator-node01-network

  core-api:
    image: ${DOCKER_REPO:-192.168.0.15:5000/p9}/core-api:${VERSION:-1.0.0}
    container_name: operator-node01-core-api
    restart: always
    ports:
      - "38000:38000"
    volumes:
      - ./etc/core/core-api.yaml:/app/etc/core.yaml:ro
    depends_on:
      - core-rpc
    networks:
      - p9-operator-node01-network

  operator-game-rpc:
    image: ${DOCKER_REPO:-192.168.0.15:5000/p9}/operator-game-rpc:${VERSION:-1.0.0}
    container_name: operator-game-rpc-node02
    restart: always
    ports:
      - "39203:39203"
    volumes:
      - ./etc/game/rpc/operator_game.yaml:/app/etc/operator_game.yaml:ro
    networks:
      - p9-operator-node02-network
      - p9-shared-network

  operator-game-api:
    image: ${DOCKER_REPO:-192.168.0.15:5000/p9}/operator-game-api:${VERSION:-1.0.0}
    container_name: operator-game-api-node02
    restart: always
    ports:
      - "38203:38203"
    volumes:
      - ./etc/game/api/operator_game.yaml:/app/etc/operator_game.yaml:ro
    networks:
      - p9-operator-node02-network
      - p9-shared-network

volumes:
  postgres_operator_node01_data:
  redis_operator_node01_data:

networks:
  p9-operator-node01-network:
    driver: bridge
  p9-shared-network:
    external: true