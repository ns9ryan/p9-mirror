syntax = "proto3";

package operator_game;

option go_package = "oa.98ent.com/p9/operator-game/rpc/pb/operator_game";
    
// GameChannelInfo 游戏渠道信息（包含名称）
message GameChannelInfo {
    int64 id = 1;
    string channel_code = 2;
    int32 provider_count = 3;
    int32 game_count = 4;
    int32 sort_no = 5;
    int32 load_type = 6;
    int32 status = 7;
    int64 created_at = 8;
    int64 updated_at = 9;
}

// GetGameChannelRequest 获取单个游戏渠道请求
message GetGameChannelRequest {
    int64 id = 1;
}

// GetGameChannelResp 获取单个游戏渠道响应
message GetGameChannelResp {
    int32 code = 1;
    string message = 2;
    GameChannelInfo data = 3;
}

// GetGameChannelListRequest 获取游戏渠道列表请求
message GetGameChannelListRequest {
    int32 page = 1;
    int32 page_size = 2;
    string channel_code = 3;
    int32 status = 4;
}

// GetGameChannelListResp 游戏渠道列表响应
message GetGameChannelListResp {
    int32 code = 1;
    string message = 2;
    repeated GameChannelInfo items = 3;
    int64 total = 4;
}

// UpdateGameChannelRequest 更新渠道请求
message UpdateGameChannelRequest {
    int64 id = 1;
    int32 sort_no = 2;
    int32 status = 3;
}

// UpdateGameChannelResp 更新渠道响应
message UpdateGameChannelResp {
    int32 code = 1;
    string message = 2;
    GameChannelInfo data = 3;
}
