syntax = "proto3";

package operator_game;

option go_package = "oa.98ent.com/p9/operator-game/rpc/pb/operator_game";

// SyncPublishedDataRequest 同步已发布数据请求
message SyncPublishedDataRequest {
    string op_code = 1;  // 分站代码
}

// SyncPublishedDataResp 同步已发布数据响应
message SyncPublishedDataResp {
    bool success = 1;
    string message = 2;
    
    // 各表的同步统计信息
    SyncStatistic category_stat = 3;
    SyncStatistic game_stat = 4;
    SyncStatistic provider_stat = 5;
    SyncStatistic channel_stat = 6;
}

// SyncStatistic 同步统计信息
message SyncStatistic {
    int64 total = 1;        // 总数
    int64 success = 2;      // 成功数
    int64 failed = 3;       // 失败数
    string failed_reason = 4; // 失败原因
}
