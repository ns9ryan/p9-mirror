syntax = "proto3";

package operator_game;

option go_package = "oa.98ent.com/p9/operator-game/rpc/pb/operator_game";

// ProviderInfo 供应商信息
message ProviderInfo {
    int64 id = 1;
    string provider_code = 2;
    string channel_code = 3;
    string logo_url = 4;
    int32 sort_no = 5;
    int32 status = 6;
    int64 created_at = 7;
    int64 updated_at = 8;
}

// GetGameProviderListRequest 获取游戏供应商列表请求
message GetGameProviderListRequest {
    int32 page = 1;
    int32 page_size = 2;
    string provider_code = 3;
    int32 status = 4;
}

// GetGameProviderListResp 游戏供应商列表响应
message GetGameProviderListResp {
    int32 code = 1;
    string message = 2;
    repeated ProviderInfo items = 3;
    int64 total = 4;
}

// GetGameProviderRequest 获取单个游戏供应商请求
message GetGameProviderRequest {
    int64 id = 1;
}

// GetGameProviderResp 获取单个游戏供应商响应
message GetGameProviderResp {
    int32 code = 1;
    string message = 2;
    ProviderInfo data = 3;
}

// UpdateGameProviderRequest 更新供应商请求
message UpdateGameProviderRequest {
    int64 id = 1;
    int32 sort_no = 2;
    int32 status = 3;
}

// UpdateGameProviderResp 更新供应商响应
message UpdateGameProviderResp {
    int32 code = 1;
    string message = 2;
    ProviderInfo data = 3;
}
