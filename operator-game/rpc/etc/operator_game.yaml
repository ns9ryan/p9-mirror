# RPC 服务配置
Name: operator-game-rpc
ListenOn: 0.0.0.0:39003
Timeout: 10000
Mode: dev               # 运行模式

# Etcd服务注册配置
Etcd:
  Hosts:
    - 127.0.0.1:2379       # Etcd地址
  Key: operator-game-rpc    # 服务注册Key

# 总网游戏服务 RPC 配置（用于同步已发布数据）
PlatformGameRpcConf:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: platform-game-rpc

CoreRpc:
  Target: 192.168.0.15:39000
  Timeout: 10000

DatabaseConf:
  Host:     127.0.0.1     # 数据库地址
  Port:     5432          # 数据库端口
  DBName:   p9_operator           # 数据库名称
  Username: root          # 数据库用户名
  Password: root          # 数据库密码
  SSLMode:  disable       # SSL模式