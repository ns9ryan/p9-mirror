# API服务配置
Name: node-dispatch-api     # API服务名称
Host: 0.0.0.0               # API监听地址
Port: 28001                 # API监听端口
Mode: dev                   # 运行模式

# Node Dispatch RPC配置
NodeDispatchRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:12379     # Etcd地址
    Key: node-dispatch-rpc  # RPC服务注册Key

# Core RPC配置
CoreRpc:
  Endpoints:
    - 127.0.0.1:19000       # Core RPC地址
  NonBlock: true            # 非阻塞连接
  Timeout: 10000            # 请求超时时间, 毫秒

# 国际化配置
I18n:
  DefaultLanguage: zh-CN    # 默认语言