# RPC服务配置
Name:     node-dispatch-rpc       # RPC服务名称
ListenOn: 0.0.0.0:29001           # RPC监听地址
Mode:     dev                     # 运行模式

# Etcd服务注册配置
Etcd:
  Hosts:
    - 127.0.0.1:12379             # Etcd地址
  Key: node-dispatch-rpc          # 服务注册Key

# WebSocket服务配置
WebSocketListenOn: 0.0.0.0:28002  # WebSocket监听地址

# HTTP回调配置
Callback:
  TaskResultURL: http://127.0.0.1:18002/internal/dispatch/task-result # 任务结果回调地址
  Secret: p9-node-dispatch-callback                                   # 回调认证密钥
  Timeout: 5000                                                       # HTTP请求超时时间, 毫秒

# 数据库配置
DatabaseConf:
  Host:     127.0.0.1             # 数据库地址
  Port:     15432                 # 数据库端口
  DBName:   p9_platform           # 数据库名称
  Username: root                  # 数据库用户名
  Password: root                  # 数据库密码
  SSLMode:  disable               # SSL模式