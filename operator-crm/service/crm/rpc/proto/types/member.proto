syntax = "proto3";

package crm_member;

option go_package = "oa.98ent.com/p9/operator-crm/service/crm/rpc/pb/crmrpc/memberpb";

// TODO: 充值业务的数据来源和命名明确后, 增加首次成功充值时间筛选类型.
// 会员列表时间筛选类型
enum MemberTimeType {
  // 不筛选时间
  MEMBER_TIME_TYPE_UNSPECIFIED = 0;
  // 注册时间
  MEMBER_TIME_TYPE_REGISTER = 1;
  // 最后登录时间
  MEMBER_TIME_TYPE_LAST_LOGIN = 2;
}

// TODO: 钱包服务接入后, 增加钱包余额排序.
// TODO: 充值业务的数据来源和命名明确后, 增加首存金额排序.
// 会员列表排序字段
enum MemberSortField {
  // 未指定时, 按注册时间倒序
  MEMBER_SORT_FIELD_UNSPECIFIED = 0;
  // 累计充值金额
  MEMBER_SORT_FIELD_TOTAL_DEPOSIT = 1;
  // 累计充值成功次数
  MEMBER_SORT_FIELD_TOTAL_DEPOSIT_COUNT = 2;
  // 累计提现金额
  MEMBER_SORT_FIELD_TOTAL_WITHDRAWAL = 3;
  // 累计提现成功次数
  MEMBER_SORT_FIELD_TOTAL_WITHDRAWAL_COUNT = 4;
}

// 会员列表排序方向
enum MemberSortOrder {
  // 未指定时, 默认降序
  MEMBER_SORT_ORDER_UNSPECIFIED = 0;
  // 升序
  MEMBER_SORT_ORDER_ASC = 1;
  // 降序
  MEMBER_SORT_ORDER_DESC = 2;
}

// TODO: 会员资料模型明确后, 扩展真实姓名、证件号码等敏感字段.
// 会员敏感信息类型
enum MemberSensitiveField {
  // 无效值, 服务端应返回参数错误
  MEMBER_SENSITIVE_FIELD_UNSPECIFIED = 0;
  // 手机号
  MEMBER_SENSITIVE_FIELD_PHONE = 1;
  // 邮箱
  MEMBER_SENSITIVE_FIELD_EMAIL = 2;
}

// 创建会员请求
message CreateMemberRequest {
  // 会员登录账号
  string account = 1;
  // 初始密码
  string password = 2;
  // 昵称, 不填写时使用账号
  optional string nickname = 3;
  // 所属分层代理 ID
  int64 agent_id = 4;
  // 运营备注, 最多 200 个字符
  optional string remark = 5;
}

// 创建会员响应
message CreateMemberResponse {
  // 会员数据库主键
  int64 id = 1;
  // 12 位会员对外编号
  string code = 2;
}

// 查看会员敏感信息请求
message GetMemberSensitiveInfoRequest {
  // 会员数据库主键
  int64 member_id = 1;
  // 要查看的敏感信息类型
  MemberSensitiveField field = 2;
}

// 查看会员敏感信息响应
message GetMemberSensitiveInfoResponse {
  // 指定敏感字段的完整值
  string value = 1;
}

// 会员列表请求
message ListMembersRequest {
  // ==================== 分页与关键字 ====================

  // 页码, 从 1 开始
  int64 page = 1;
  // 每页数量
  int64 page_size = 2;
  // 查询关键字, 匹配会员账号、会员编号或昵称
  string keyword = 3;

  // ==================== 时间筛选 ====================

  // 时间筛选类型
  MemberTimeType time_type = 4;
  // 起始时间, Unix 毫秒时间戳, 包含该时刻
  optional int64 start_at = 5;
  // 结束时间, Unix 毫秒时间戳, 不包含该时刻
  optional int64 end_at = 6;

  // ==================== 等级与注册信息 ====================

  // 自动层级 ID
  optional int64 auto_level_id = 7;
  // 固定层级 ID
  optional int64 fixed_level_id = 8;
  // 注册方式
  optional string register_method = 9;
  // 注册渠道
  optional string register_channel = 10;

  // ==================== 会员状态与归属 ====================

  // 会员状态: 1 正常, 2 冻结, 3 禁用
  optional int64 status = 11;
  // 所属分层代理 ID, 服务端必须校验当前厅的访问范围
  optional int64 agent_id = 12;

  // ==================== 其他筛选条件 ====================

  // 仅查询禁止投注的会员
  bool betting_disabled = 13;
  // 仅查询未绑定手机号的会员
  bool no_phone = 14;
  // 仅查询未绑定邮箱的会员
  bool no_email = 15;
  // 仅查询有成功充值记录的会员
  bool deposited = 16;
  // 仅查询没有成功充值记录的会员
  bool not_deposited = 17;

  // ==================== 排序 ====================

  // 排序字段, 未指定时按注册时间倒序
  MemberSortField sort_by = 18;
  // 排序方向, 未指定时默认降序; 未指定排序字段时不生效
  MemberSortOrder sort_order = 19;
}

// 固定层级信息
message MemberFixedLevelInfo {
  // 固定层级 ID
  int64 id = 1;
  // 固定层级名称
  string name = 2;
}

// 会员等级信息
message MemberLevelInfo {
  // ==================== 自动层级 ====================

  // 自动层级 ID
  int64 auto_level_id = 1;
  // 自动层级名称
  string auto_level_name = 2;

  // ==================== 固定层级 ====================

  // 已分配的固定层级列表
  repeated MemberFixedLevelInfo fixed_levels = 3;

  // ==================== VIP 等级 ====================

  // VIP 等级 ID
  int64 vip_level_id = 4;
  // VIP 等级编号
  int64 vip_level = 5;
}

// 会员统计信息
// 金额使用厅结算币种的最小单位.
// 没有统计记录时, 统计金额和次数返回 0.
message MemberStatsInfo {
  // ==================== 累计资金统计 ====================

  // 累计充值金额
  int64 total_deposit = 1;
  // 累计充值成功次数
  int64 total_deposit_count = 2;
  // 累计提现金额
  int64 total_withdrawal = 3;
  // 累计提现成功次数
  int64 total_withdrawal_count = 4;
  // 总存提差额, 累计充值金额减去累计提现金额
  int64 total_deposit_withdrawal_diff = 5;

  // ==================== 累计游戏统计 ====================

  // 累计投注金额
  int64 total_bet = 6;
  // 累计有效投注金额
  int64 total_valid_bet = 7;
  // 累计洗码量
  int64 total_water = 8;
  // 累计会员净输赢金额, 正数盈利, 负数亏损
  int64 total_win_loss = 9;

  // TODO: 游戏注单及结算规则明确后, 增加未结算金额.

  // ==================== 当前结算周期统计 ====================

  // 当前周期充值金额
  int64 current_period_deposit = 10;
  // 当前周期提现金额
  int64 current_period_withdrawal = 11;
  // 当前周期投注金额
  int64 current_period_bet = 12;
  // 当前周期有效投注金额
  int64 current_period_valid_bet = 13;
  // 当前周期洗码量
  int64 current_period_water = 14;
  // 当前周期会员净输赢金额, 正数盈利, 负数亏损
  int64 current_period_win_loss = 15;
  // 当前结算周期开始时间, Unix 毫秒时间戳
  optional int64 current_period_started_at = 16;

  // TODO: 优惠业务及统计口径明确后, 增加当前周期优惠金额.
}

// 会员列表项
message MemberListItem {
  // ==================== 会员基本信息 ====================

  // 会员数据库主键
  int64 id = 1;
  // 12 位会员对外编号
  string code = 2;
  // 会员登录账号
  string account = 3;
  // 会员昵称
  string nickname = 4;

  // ==================== 代理归属 ====================

  // 所属分层代理 ID
  int64 agent_id = 5;
  // 所属分层代理账号
  string agent_account = 6;

  // ==================== 等级信息 ====================

  // 会员当前等级信息
  MemberLevelInfo levels = 7;

  // ==================== 状态与注册信息 ====================

  // 会员状态: 1 正常, 2 冻结, 3 禁用
  int64 status = 8;
  // 是否禁止发言
  bool chat_disabled = 9;
  // 是否禁止投注
  bool betting_disabled = 10;
  // 是否禁止提款
  bool withdrawal_disabled = 11;
  // 注册方式
  string register_method = 12;
  // 注册渠道
  string register_channel = 13;
  // 注册时间, Unix 毫秒时间戳
  int64 created_at = 14;
  // 最后登录时间, Unix 毫秒时间戳
  optional int64 last_login_at = 15;
  // 最后登录 IP
  optional string last_login_ip = 16;

  // ==================== 联系方式 ====================

  // 已脱敏手机号, 未绑定时不设置
  optional string phone = 17;
  // 已脱敏邮箱, 未绑定时不设置
  optional string email = 18;

  // ==================== 运营信息 ====================

  // 邀请人会员 ID
  optional int64 inviter_member_id = 19;
  // 运营备注
  optional string remark = 20;

  // ==================== 统计信息 ====================

  // 会员统计, 无统计记录时统计金额和次数返回 0
  MemberStatsInfo stats = 21;

  // TODO: 钱包服务接入后, 增加钱包余额字段.
}

// 会员列表响应
message ListMembersResponse {
  // 符合条件的总条数
  int64 total = 1;
  // 会员列表
  repeated MemberListItem list = 2;
}
