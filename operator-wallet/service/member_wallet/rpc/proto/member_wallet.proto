syntax = "proto3";

package member_wallet;

option go_package = "oa.98ent.com/p9/operator-wallet/service/member_wallet/rpc/pb/memberwalletrpc";

// ==================== 基础服务 ====================

// 基础服务
import "types/member_wallet_ping.proto";

// ==================== 会员钱包 ====================

import "types/member_wallet_manage.proto";
import "types/member_wallet_deposit.proto";
import "types/member_wallet_withdraw.proto";
import "types/member_wallet_game.proto";
import "types/member_wallet_reward.proto";

// 会员钱包健康检查服务
service Ping {
  // 健康检查
  rpc Ping(member_wallet_ping.PingRequest) returns (member_wallet_ping.PingResponse);
}

// 会员钱包资金服务
service MemberWallet {
  // ==================== 钱包管理 ====================

  // 创建会员钱包
  rpc CreateWallet(member_wallet_manage.CreateWalletRequest) returns (member_wallet_manage.CreateWalletResponse);

  // ==================== 存款 ====================

  // 存款本金入账
  rpc DepositCredit(member_wallet_deposit.DepositCreditRequest) returns (member_wallet_deposit.DepositCreditResponse);

  // 存款赠送入账
  rpc DepositBonus(member_wallet_deposit.DepositBonusRequest) returns (member_wallet_deposit.DepositBonusResponse);


  // ==================== 提现 ====================

  // 提现冻结
  rpc WithdrawalFreeze(member_wallet_withdraw.WithdrawalFreezeRequest) returns (member_wallet_withdraw.WithdrawalFreezeResponse);

  // 提现出款
  rpc WithdrawalPayout(member_wallet_withdraw.WithdrawalPayoutRequest) returns (member_wallet_withdraw.WithdrawalPayoutResponse);

  // 提现解冻退回
  rpc WithdrawalUnfreeze(member_wallet_withdraw.WithdrawalUnfreezeRequest) returns (member_wallet_withdraw.WithdrawalUnfreezeResponse);


  // ==================== 游戏 ====================

  // 游戏下注
  rpc GameBet(member_wallet_game.GameBetRequest) returns (member_wallet_game.GameBetResponse);

  // 游戏下注取消
  rpc GameBetCancel(member_wallet_game.GameBetCancelRequest) returns (member_wallet_game.GameBetCancelResponse);

  // 游戏结算
  rpc GameSettlement(member_wallet_game.GameSettlementRequest) returns (member_wallet_game.GameSettlementResponse);

  // 游戏消费打赏
  rpc GameTip(member_wallet_game.GameTipRequest) returns (member_wallet_game.GameTipResponse);

  // 游戏返水
  rpc GameRebate(member_wallet_game.GameRebateRequest) returns (member_wallet_game.GameRebateResponse);

  // 游戏结算回滚
  rpc GameSettlementRollback(member_wallet_game.GameSettlementRollbackRequest) returns (member_wallet_game.GameSettlementRollbackResponse);


  // ==================== 奖励 ====================

  // 活动奖励入账
  rpc ActivityReward(member_wallet_reward.ActivityRewardRequest) returns (member_wallet_reward.ActivityRewardResponse);

  // 任务奖励入账
  rpc TaskReward(member_wallet_reward.TaskRewardRequest) returns (member_wallet_reward.TaskRewardResponse);

  // 全民代理佣金入账
  rpc CommissionCredit(member_wallet_reward.CommissionCreditRequest) returns (member_wallet_reward.CommissionCreditResponse);

  // 有奖反馈奖励入账
  rpc FeedbackReward(member_wallet_reward.FeedbackRewardRequest) returns (member_wallet_reward.FeedbackRewardResponse);

  // VIP 奖励入账
  rpc VipReward(member_wallet_reward.VipRewardRequest) returns (member_wallet_reward.VipRewardResponse);
}