syntax = "proto3";

package member_wallet_reward;

option go_package = "oa.98ent.com/p9/operator-wallet/service/member_wallet/rpc/pb/memberwalletrpc/rewardpb";

// 活动奖励入账请求
message ActivityRewardRequest {
  // 会员全局唯一标识
  string member_global_id = 1;
  // 钱包操作唯一标识, UUID
  string operation_id = 2;
  // 活动奖励订单号
  string activity_order_no = 3;

  // 钱包结算币种编码
  string currency_code = 4;
  // 奖励金额, 币种最小单位
  int64 amount = 5;
}

// 活动奖励入账响应
message ActivityRewardResponse {}


