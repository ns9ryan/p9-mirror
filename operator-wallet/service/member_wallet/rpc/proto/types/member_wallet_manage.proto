syntax = "proto3";

package member_wallet_manage;

option go_package = "oa.98ent.com/p9/operator-wallet/service/member_wallet/rpc/pb/memberwalletrpc/managepb";

// 创建会员钱包请求
message CreateWalletRequest {
  // CRM会员ID
  int64 member_id = 1;
  // CRM会员全局唯一标识
  string member_global_id = 2;

  // 钱包结算币种编码
  string currency_code = 3;
}

// 创建会员钱包响应
message CreateWalletResponse {
  // 钱包全局唯一标识
  string wallet_global_id = 1;
}

// 查询会员钱包余额请求
message GetBalanceRequest {
  // CRM会员全局唯一标识
  string member_global_id = 1;
}

// 查询会员钱包余额响应
message GetBalanceResponse {
  // 钱包全局唯一标识
  string wallet_global_id = 1;
  // 钱包结算币种
  string currency_code = 2;

  // 可用余额
  int64 balance = 3;
  // 冻结余额
  int64 frozen_balance = 4;
  // 游戏未结算余额
  int64 unsettled_balance = 5;

  // 钱包状态版本
  int64 version = 6;
}