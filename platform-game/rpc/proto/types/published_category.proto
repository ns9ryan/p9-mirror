syntax = "proto3";

package platform_game;

option go_package = "oa.98ent.com/p9/platform-game/rpc/pb/platform_game";

// PublishedGameCategoryInfo 已发布的游戏分类信息
message PublishedGameCategoryInfo {
    int64 id = 1;
    string category_code = 2;
    int64 sort_no = 3;
    int32 status = 4;
    int64 created_at = 5;
    int64 updated_at = 6;
}

// GetPublishedGameCategoryListRequest 获取已发布游戏分类列表请求
message GetPublishedGameCategoryListRequest {
    string op_code = 1;
    int32 page = 2;
    int32 page_size = 3;
}

// GetPublishedGameCategoryListResp 已发布游戏分类列表响应
message GetPublishedGameCategoryListResp {
    repeated PublishedGameCategoryInfo items = 1;
    int64 total = 2;
    int32 page = 3;
    int32 page_size = 4;
}
