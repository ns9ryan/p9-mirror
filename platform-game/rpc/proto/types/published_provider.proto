syntax = "proto3";

package platform_game;

option go_package = "oa.98ent.com/p9/platform-game/rpc/pb/platform_game";

// PublishedGameProviderInfo 已发布的游戏供应商信息
message PublishedGameProviderInfo {
    int64 id = 1;
    string provider_code = 2;
    string channel_code = 3;
    string logo_url = 4;
    int64 sort_no = 5;
    int32 status = 6;
    int64 created_at = 7;
    int64 updated_at = 8;
}

// GetPublishedGameProviderListRequest 获取已发布游戏供应商列表请求
message GetPublishedGameProviderListRequest {
    string op_code = 1;
    int32 page = 2;
    int32 page_size = 3;
}

// GetPublishedGameProviderListResp 已发布游戏供应商列表响应
message GetPublishedGameProviderListResp {
    repeated PublishedGameProviderInfo items = 1;
    int64 total = 2;
    int32 page = 3;
    int32 page_size = 4;
}
