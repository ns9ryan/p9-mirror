syntax = "proto3";

package platform_game;

option go_package = "oa.98ent.com/p9/platform-game/rpc/pb/platform_game";

// PublishedGameInfo 已发布的游戏信息
message PublishedGameInfo {
    int64 id = 1;
    int64 source_id = 2;
    string game_code = 3;
    string category_code = 4;
    string provider_code = 5;
    string channel_code = 6;
    string name = 7;
    repeated string currency_code_list = 8;
    string provider_key = 9;
    string image_url = 10;
    int64 sort_no = 11;
    bool supports_embed = 12;
    bool supports_redirect = 13;
    int32 status = 14;
    int64 created_at = 15;
    int64 updated_at = 16;
}

// GetPublishedGameListRequest 获取已发布游戏列表请求
message GetPublishedGameListRequest {
    string op_code = 1;
    int32 page = 2;
    int32 page_size = 3;
    string category_code = 4;
    string provider_code = 5;
}

// GetPublishedGameListResp 已发布游戏列表响应
message GetPublishedGameListResp {
    repeated PublishedGameInfo game_items = 1;
    int64 total = 2;
    int32 page = 3;
    int32 page_size = 4;
}
