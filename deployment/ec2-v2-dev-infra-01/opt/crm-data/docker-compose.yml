services:
  postgres:
    image: postgres:16
    restart: always
    ports: ["5432:5432"]
    mem_limit: 1g
    shm_size: 256m
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: crm
      TZ: Asia/Kuala_Lumpur
    command: >
      postgres -c max_connections=200 -c shared_buffers=256MB
      -c effective_cache_size=512MB -c wal_level=logical
    volumes:
      - /data/postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: always
    ports: ["6379:6379"]
    mem_limit: 384m
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - /data/redis:/data

  kafka:
    image: apache/kafka:3.8.0
    restart: always
    ports: ["9092:9092"]
    mem_limit: 1g
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${HOST_IP}:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - /data/kafka:/var/lib/kafka/data

  doris-fe:
    image: apache/doris:fe-2.1.7
    restart: always
    network_mode: host
    mem_limit: 1536m
    environment:
      FE_SERVERS: fe1:${HOST_IP}:9010
      FE_ID: 1
    ulimits:
      nofile:
        soft: 655350
        hard: 655350
    volumes:
      - /data/doris-fe/meta:/opt/apache-doris/fe/doris-meta
      - /data/doris-fe/conf/fe.conf:/opt/apache-doris/fe/conf/fe.conf

  doris-be:
    image: apache/doris:be-2.1.7
    restart: always
    network_mode: host
    mem_limit: 3g
    depends_on: [doris-fe]
    environment:
      FE_SERVERS: fe1:${HOST_IP}:9010
      BE_ADDR: ${HOST_IP}:9050
    ulimits:
      nofile:
        soft: 655350
        hard: 655350
    volumes:
      - /data/doris-be/storage:/opt/apache-doris/be/storage
      - /data/doris-be/conf/be.conf:/opt/apache-doris/be/conf/be.conf
