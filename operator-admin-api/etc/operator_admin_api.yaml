Name: operator_admin_api
Host: 0.0.0.0
Port: 38010
Mode: dev

# 国际化配置
I18n:
  DefaultLanguage: zh-CN    # 默认语言
  
# 分站Core RPC配置
OperatorCoreRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:12379
    Key: operator-core-rpc

# 后台基础服务 RPC配置
OperatorBaseRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:12379
    Key: operator-base-rpc

# 后台CRM RPC配置
CrmRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:12379
    Key: crm-rpc

# 第三方服务集成 RPC配置
IntegrationRpc:
  Target: 192.168.0.15:19005