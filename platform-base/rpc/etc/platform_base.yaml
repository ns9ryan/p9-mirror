# RPC服务配置
Name:     platform-base-rpc # RPC服务名称
ListenOn: 0.0.0.0:19001     # RPC监听地址
Mode:     dev               # 运行模式

# 默认素材公开地址前缀，包含桶路径；存 Key 时需要按实际部署填写。
ResourceBaseURL: ""

# Etcd服务注册配置
Etcd:
  Hosts:
    - 127.0.0.1:12379       # Etcd地址
  Key: platform-base-rpc    # 服务注册Key

# 数据库配置
DatabaseConf:
  Host:     127.0.0.1       # 数据库地址
  Port:     15432           # 数据库端口
  DBName:   p9_platform     # 数据库名称
  Username: root            # 数据库用户名
  Password: root            # 数据库密码
  SSLMode:  disable         # SSL模式

# 昵称缓存，配置方式与 core 的 DataRedis 一致；Host 为空时直接回源。
DataRedis:
  Host: 127.0.0.1:16379
  Pass: ""
  DB: 0

# 非空列表缓存有效期，支持 24h、72h 等时长。
ListCacheTTL: 24h
