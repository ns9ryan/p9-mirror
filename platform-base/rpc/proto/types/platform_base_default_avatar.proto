syntax = "proto3";

package platform_base_defaultavatar;

option go_package = "oa.98ent.com/p9/platform-base/rpc/pb/platformbaserpc/defaultavatarpb";

// 总站默认头像信息，默认选中哪张由分站管理。
message DefaultAvatarInfo {
  // 图片主键，修改时保持不变。
  int64 id = 1;
  // 可直接展示的完整公开 URL，由已存 Key 与公开前缀拼接；空字符串表示尚未配置。
  string image_url = 2;
}

// 获取全部默认头像，供总站后台及分站服务读取。
message ListAllDefaultAvatarsRequest {}
// 全部默认头像响应，按主键升序；查询不写库。
message ListAllDefaultAvatarsResponse {
  // 默认头像列表，空列表返回空集合；固定数量由既有初始化流程补齐。
  repeated DefaultAvatarInfo list = 1;
}

// 分站获取新会员初始头像，无需传入会员、站点或管理员令牌。
message RandomDefaultAvatarRequest {}
// 从已配置的默认头像中等概率选择一张；没有可用头像时返回 NotFound。
message RandomDefaultAvatarResponse {
  // 选中的头像，image_url 已拼为完整公开地址；分站负责保存本次选择。
  DefaultAvatarInfo avatar = 1;
}

// 仅修改已有图片，不新增记录，不接受客户端指定修改人。
message UpdateDefaultAvatarRequest {
  // 必须为已有记录的正整数主键，不能通过修改新增素材。
  int64 id = 1;
  // 图片完整公开 URL 或本类对象 Key，最长 1024 字节，不允许清空或使用签名地址。
  string image_url = 2;
}
// 修改成功时无额外业务字段；修改人取自认证上下文。
message UpdateDefaultAvatarResponse {}
