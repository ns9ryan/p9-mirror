# API服务配置
Name: operator-base-api      # API服务名称
Host: 0.0.0.0                # API监听地址
Port: 38001                  # API监听端口
Mode: dev                    # 运行模式

# Operator Base RPC配置
OperatorBaseRpc:
  Endpoints:
    - 127.0.0.1:39001        # Operator Base RPC地址
  NonBlock: true             # 非阻塞连接
  Timeout: 10000             # 请求超时时间, 毫秒